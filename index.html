<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greenfield College</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h2>KL UNIVERSITY</h2>
    <nav>
      <a href="#about">About</a>
      <a href="#courses">Courses</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Build Your Future</h1>
    <p>Learn, grow, and achieve your goals with us.</p>
    <a href="#courses">View Courses</a>
  </section>

  <section id="about">
    <h2>About Our College</h2>
    <p>We provide quality education and a friendly campus for every student.</p>
  </section>

  <section id="courses">
    <h2>Our Courses</h2>
    <table>
      <tr><th>Course</th><th>Duration</th></tr>
      <tr><td>Computer Science</td><td>3 years</td></tr>
      <tr><td>Business Studies</td><td>3 years</td></tr>
    </table>
  </section>

  <section id="contact">
    <h2>Contact Us</h2>
    <form id="contactForm">
      <input id="name" type="text" placeholder="Your name" required>
      <input type="email" placeholder="Your email" required>
      <textarea placeholder="Your message" required></textarea>
      <button type="submit">Send</button>
    </form>
    <p id="message"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
